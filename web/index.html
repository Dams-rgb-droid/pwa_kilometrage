<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Suivi des kilomètres professionnels et privés.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <!-- iOS : application plein écran lancée depuis l'écran d'accueil -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kilométrage">
  <meta name="theme-color" content="#F5F7FC">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Kilométrage Pro</title>

  <style>
    html { height: 100%; background: #F5F7FC; overscroll-behavior: none; }
    body { margin: 0; height: 100%; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    #boot {
      position: fixed; inset: 0; z-index: -1;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #3157C8;
    }
    #boot .spin {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #d5dcf2; border-top-color: #3157C8;
      animation: kmspin 0.9s linear infinite;
    }
    @keyframes kmspin { to { transform: rotate(360deg); } }
    #recovery {
      position: fixed; left: 16px; right: 16px; bottom: 24px; z-index: 2147483647;
      padding: 14px 16px; border-radius: 16px; background: #fff;
      box-shadow: 0 6px 24px rgba(0,0,0,.18); font: 15px/1.4 -apple-system, sans-serif; color: #222;
      display: none;
    }
    #recovery button {
      margin-top: 10px; padding: 10px 16px; border: 0; border-radius: 12px;
      background: #3157C8; color: #fff; font: 600 15px -apple-system, sans-serif;
    }
  </style>
</head>
<body>
  <div id="boot"><div class="spin"></div></div>
  <div id="recovery">
    Le chargement est plus long que prévu.
    <br><button id="recovery-btn" type="button">Réparer et recharger</button>
  </div>

  <script>
    // ---- Partage de fichier (iPhone : le téléchargement classique ne marche pas
    // dans une application ajoutée à l'écran d'accueil) ---------------------------
    window.kmShareFile = async function (name, mime, bytes) {
      try {
        const file = new File([bytes], name, { type: mime });
        if (!navigator.share || !navigator.canShare || !navigator.canShare({ files: [file] })) {
          return 'unsupported';
        }
        await navigator.share({ files: [file], title: name });
        return 'shared';
      } catch (e) {
        return e && e.name === 'AbortError' ? 'cancelled' : 'unsupported';
      }
    };

    // ---- Choix d'un fichier texte (restauration de sauvegarde) ----------------------
    window.kmPickTextFile = function () {
      return new Promise(function (resolve) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json,application/json,text/plain';
        input.style.display = 'none';
        function done(text) { resolve(text); input.remove(); }
        input.addEventListener('change', function () {
          var f = input.files && input.files[0];
          if (!f) return done('');
          f.text().then(done, function () { done(''); });
        });
        input.addEventListener('cancel', function () { done(''); });
        document.body.appendChild(input);
        input.click();
      });
    };

    // ---- Lecture du compteur sur une photo (OCR sur l'appareil, Tesseract.js) -------
    // Étape 1 : choix / prise de la photo (doit suivre directement un toucher).
    window.kmPickPhoto = function () {
      return new Promise(function (resolve) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.setAttribute('capture', 'environment');
        input.style.display = 'none';
        function done(v) { resolve(v); input.remove(); }
        input.addEventListener('change', function () {
          var f = input.files && input.files[0];
          if (!f) return done('CANCEL');
          window.__kmPhoto = f;
          done('OK');
        });
        input.addEventListener('cancel', function () { done('CANCEL'); });
        document.body.appendChild(input);
        input.click();
      });
    };

    function kmAbs(path) { return new URL(path, document.baseURI).href; }
    function kmLoadScript(src, isLoaded) {
      return new Promise(function (ok, ko) {
        if (isLoaded()) return ok();
        var s = document.createElement('script');
        s.src = src; s.onload = ok;
        s.onerror = function () { ko(new Error('fichier introuvable : ' + src)); };
        document.head.appendChild(s);
      });
    }

    // Image -> niveaux de gris, plus grand côté = maxSide px (jamais agrandie).
    function kmGrayCanvas(img, maxSide) {
      var k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      var w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
      var canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
      var data = ctx.getImageData(0, 0, w, h), px = data.data, gray = new Uint8Array(w * h);
      for (var i = 0, j = 0; i < px.length; i += 4, j++) {
        gray[j] = Math.round(0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]);
      }
      return { gray: gray, w: w, h: h };
    }

    // Niveaux de gris (noir sur blanc) -> canvas de 120 px de haut pour l'OCR.
    function kmCropCanvas(crop) {
      var src = document.createElement('canvas'); src.width = crop.width; src.height = crop.height;
      var sctx = src.getContext('2d'), id = sctx.createImageData(crop.width, crop.height);
      for (var i = 0; i < crop.data.length; i++) {
        id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = crop.data[i]; id.data[i * 4 + 3] = 255;
      }
      sctx.putImageData(id, 0, 0);
      var k = 120 / crop.height, out = document.createElement('canvas');
      out.width = Math.max(1, Math.round(crop.width * k)); out.height = 120;
      var octx = out.getContext('2d'); octx.imageSmoothingQuality = 'high';
      octx.fillStyle = '#fff'; octx.fillRect(0, 0, out.width, out.height);
      octx.drawImage(src, 0, 0, out.width, out.height);
      return out;
    }

    function kmBestRun(text) {
      var runs = (text || '').match(/\d{3,7}/g) || [], best = '';
      runs.forEach(function (r) { if (r.length > best.length) best = r; });
      return best;
    }

    // Étape 2 : lecture. Retourne 'OK:12345', 'NONE' ou 'ERROR:message'.
    window.kmRecognizeOdometer = async function () {
      var worker = null;
      try {
        var file = window.__kmPhoto; window.__kmPhoto = null;
        if (!file) return 'CANCEL';

        var url = URL.createObjectURL(file);
        var img = new Image(); img.src = url; await img.decode();
        URL.revokeObjectURL(url);

        await kmLoadScript(kmAbs('ocr_prep.js'), function () { return !!window.kmOcrPrep; });
        await kmLoadScript(kmAbs('ocr/tesseract.min.js'), function () { return !!window.Tesseract; });
        worker = await Tesseract.createWorker('eng', 1, {
          workerPath: kmAbs('ocr/worker.min.js'),
          corePath: kmAbs('ocr/'),
          langPath: kmAbs('ocr/lang'),
          gzip: true
        });
        await worker.setParameters({ tessedit_char_whitelist: '0123456789' });

        // 1) Repère automatiquement la ligne de chiffres, la recadre et la lit.
        var attempts = [[1000, 'light'], [1000, 'dark'], [1600, 'light']];
        await worker.setParameters({ tessedit_pageseg_mode: '7' });
        for (var n = 0; n < attempts.length; n++) {
          var g = kmGrayCanvas(img, attempts[n][0]);
          var crop = window.kmOcrPrep.findDigitRow(g.gray, g.w, g.h, attempts[n][1]);
          if (!crop) continue;
          var res = await worker.recognize(kmCropCanvas(crop));
          var found = kmBestRun(res.data.text);
          if (found) { await worker.terminate(); return 'OK:' + found; }
        }

        // 2) Secours : lecture de l'image entière.
        var full = kmGrayCanvas(img, 1600);
        var c = document.createElement('canvas'); c.width = full.w; c.height = full.h;
        var cctx = c.getContext('2d'), fid = cctx.createImageData(full.w, full.h);
        for (var i = 0; i < full.gray.length; i++) {
          fid.data[i * 4] = fid.data[i * 4 + 1] = fid.data[i * 4 + 2] = full.gray[i]; fid.data[i * 4 + 3] = 255;
        }
        cctx.putImageData(fid, 0, 0);
        await worker.setParameters({ tessedit_pageseg_mode: '6' });
        var all = await worker.recognize(c);
        await worker.terminate();
        var best = kmBestRun(all.data.text);
        return best ? 'OK:' + best : 'NONE';
      } catch (e) {
        try { if (worker) await worker.terminate(); } catch (_) {}
        return 'ERROR:' + (e && e.message ? e.message : e);
      }
    };

    // ---- Réparation : supprime service workers + caches puis recharge ------------
    async function resetApp() {
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(function (r) { return r.unregister(); }));
        const keys = await caches.keys();
        await Promise.all(keys.map(function (k) { return caches.delete(k); }));
      } catch (e) {}
      location.reload();
    }
    document.getElementById('recovery-btn').addEventListener('click', resetApp);
    var recoveryTimer = setTimeout(function () {
      document.getElementById('recovery').style.display = 'block';
    }, 20000);

    // ---- Premier affichage ----------------------------------------------------------
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(recoveryTimer);
      var r = document.getElementById('recovery'); if (r) r.remove();
      var b = document.getElementById('boot'); if (b) b.remove();
      // Demande à iOS de ne pas purger les données locales (relevés).
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    });
    // Mémorise pour le mode hors ligne tout ce que l'application a chargé.
    // Plusieurs passages, sans dépendre de l'événement de premier affichage.
    window.addEventListener('load', function () {
      [3000, 8000, 20000].forEach(function (d) { setTimeout(reportResources, d); });
    });

    function reportResources() {
      if (!('serviceWorker' in navigator)) return;
      var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
      urls.push(location.href);
      navigator.serviceWorker.ready.then(function (reg) {
        var sw = reg.active || navigator.serviceWorker.controller;
        if (sw) sw.postMessage({ type: 'CACHE_URLS', urls: urls });
      }).catch(function () {});
    }

    // ---- Service worker (HTTPS ou localhost uniquement) -----------------------------
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('offline_worker.js').then(function (reg) {
          reg.update().catch(function () {});
        }).catch(function (e) { console.warn('Service worker non enregistré', e); });
      });
    }
  </script>
  <script>{{flutter_bootstrap_js}}</script>
</body>
</html>
