# Construit l'application Flutter Web et la publie sur GitHub Pages
# à chaque envoi (push) sur la branche main.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Fichiers de lecture du compteur (OCR), non conservés dans le dépôt.
      - name: Télécharger les fichiers OCR
        run: |
          mkdir -p web/ocr/lang
          J=https://cdn.jsdelivr.net/npm
          curl -fsSL -o web/ocr/tesseract.min.js $J/tesseract.js@5.1.1/dist/tesseract.min.js
          curl -fsSL -o web/ocr/worker.min.js $J/tesseract.js@5.1.1/dist/worker.min.js
          for f in tesseract-core tesseract-core-simd tesseract-core-lstm tesseract-core-simd-lstm; do
            curl -fsSL -o web/ocr/$f.wasm.js $J/tesseract.js-core@5.1.1/$f.wasm.js
          done
          curl -fsSL -o web/ocr/lang/eng.traineddata.gz https://tessdata.projectnaptha.com/4.0.0_fast/eng.traineddata.gz

      - run: flutter pub get

      - name: Construire
        run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
